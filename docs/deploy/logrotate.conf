# mem3 daemon log rotation (tasks.md T102).
#
# `mem3 serve --log-format=jsonl` writes one JSON object per line to STDERR and
# keeps no log file of its own: rotation is the operator's job (Constitution
# VII, "log rotation external"). Point stderr at a file, e.g.
#
#   mem3 serve --log-format=jsonl --log-every=60 2>>/var/log/mem3/mem3.jsonl
#
# `copytruncate` is required: the daemon holds fd 2 open for its whole life and
# has no reopen-on-SIGHUP, so renaming the file would leave it writing to the
# rotated copy. Lines are single write(2) calls, so a truncate never splits one
# in half; lines written between the copy and the truncate can be lost.
#
# NOT EXERCISED: this file was written, not run under a real logrotate.
/var/log/mem3/*.jsonl {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
