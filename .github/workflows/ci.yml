name: CI

# This workflow exists because this repo once shipped a green CI gate that
# could never go red. Four separate causes conspired:
#
#   1. `zig build` referenced an OptimizeMode name removed in Zig 0.17, so the
#      binary did not compile — but nothing ever ran it.
#   2. Library code wrote to stderr from inside a test. Zig's test runner
#      talks to the build system over the process pipes under `--listen=-`;
#      any stderr write desynchronises the protocol, the test binary dies with
#      `failed command`, and `zig build test` STILL exits 0.
#   3. Three e2e tests silently skipped themselves (`return;` instead of
#      `return error.SkipZigTest`) and were counted as passes.
#   4. Tests wrote into the repo's `data/` dir, which only existed because
#      someone's working tree was dirty; on a fresh clone they died with
#      `WALOpenFailed`.
#
# All four are fixed. The step named "Guard: the test gate can go red" below is
# the permanent guard for this whole class of bug: it proves the gate fails
# when a test fails. If that step ever goes red, the gate is lying to you.
#
# Jobs:
#   build-and-test       native build + every gate, on ubuntu x86_64, ubuntu
#                        aarch64 (GitHub-hosted arm runner) and macOS arm64.
#   cross-compile        the whole project (CLI, lib, bench, examples) compiled
#                        for the four supported targets; compile-only, nothing
#                        foreign is executed.
#   unsupported-targets  Windows and WASM must keep being REFUSED, with the
#                        documented message. A refusal that silently rots into
#                        an obscure compile error is a regression.
#
# What has and has not been run: see the "CI" section of README.md and the
# T011/T072/T073/T075/T077 notes in specs/001-trisource-everos-mvp/tasks.md.
# This file has been linted and its shell snippets run on a developer machine;
# a GitHub runner has not executed it yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, gate-can-go-red (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not hide what the others say: a Linux-only
      # failure and a macOS-only failure are different bugs.
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64,   os: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `.zigversion` at the repo root pins 0.17.0. setup-zig's input is
      # `version` (it is NOT `zig-version`), and it resolves 0.17.0 from the
      # same community-mirror index as ziglang.org/download.
      #
      # Caching: setup-zig caches Zig's *global* cache (std, compiler_rt, libc
      # stubs), keyed per OS+arch, which is the expensive, input-independent
      # part. The repo-local `.zig-cache` is deliberately NOT cached: a restored
      # cache lets `zig build test` replay a previous green result without
      # executing anything (see AGENTS.md "Test-suite rules"), which is exactly
      # the trap this workflow exists to avoid.
      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Verify toolchain matches .zigversion
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .zigversion)"
          installed="$(zig version)"
          echo "pinned=$pinned installed=$installed"
          if [ "$pinned" != "$installed" ]; then
            echo "::error::toolchain drift: .zigversion says $pinned, runner has $installed"
            exit 1
          fi

      # Cause #1: the build system itself used to be broken and nothing ran it.
      - name: zig build
        run: zig build

      # Constitution IV: no new shared-library dependency. The logic lives in
      # scripts/check_linked_libs.sh (Linux: ldd allow-list; macOS: otool -L
      # allow-list) so it can be tested with canned tool output; the self-test
      # runs first so a broken checker cannot pass the build by accident.
      # Checks every installed executable (mem3, mem3-bench, the examples).
      - name: Check linked libraries (Constitution IV)
        run: |
          set -euo pipefail
          ./scripts/check_linked_libs.sh --self-test
          for bin in zig-out/bin/*; do
            echo "::group::$bin"
            ./scripts/check_linked_libs.sh "$bin"
            echo "::endgroup::"
          done

      - name: zig build test
        run: zig build test

      # Kept as a separate, more visible step (Constitution Principle VI).
      # Causes #3 and #4 live behind this one, so it is not folded into the
      # main test run.
      - name: zig build check-constitution
        run: zig build check-constitution

      # KNOWN FAILURE — this step is expected to be red until the Timer defect
      # is fixed. `platform.clock.Timer` is folded to 0 ns by LLVM under
      # ReleaseFast/ReleaseSafe, so the in-tree test `Timer measures a non-zero,
      # monotonic duration` fails in optimised builds only. Tracked in
      # docs/roadmap.md ("Other open work": `platform.clock.Timer` returns zero
      # for folded measurements) and README.md ("Known misses").
      #
      # `continue-on-error` keeps it from blocking the job, but it is NOT
      # hidden: the step shows as failed, each failing test is surfaced as a
      # warning annotation and in the job summary, so a SECOND, unrelated
      # ReleaseFast failure is visible as an extra line. When the Timer fix
      # lands, delete `continue-on-error` and this comment: this step becomes
      # a gate.
      - name: 'zig build test -Doptimize=ReleaseFast (known failure: Timer, docs/roadmap.md)'
        continue-on-error: true
        run: |
          set +e
          zig build test -Doptimize=ReleaseFast --summary all 2>&1 | tee "$RUNNER_TEMP/releasefast-test.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            failed="$(grep -E "^error: '.+' failed" "$RUNNER_TEMP/releasefast-test.log" || true)"
            {
              echo "### ReleaseFast test run FAILED (exit $rc)"
              echo "Known: \`platform.clock.test.Timer measures a non-zero, monotonic duration\` (docs/roadmap.md)."
              echo '```'
              if [ -n "$failed" ]; then echo "$failed"; else echo "no per-test failure line: build/compile failure, see log"; fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$failed" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=ReleaseFast test failure::$line"
            done
          fi
          exit "$rc"

      # The shipped artifact is the ReleaseFast one, so check its libs too.
      # (Cached from the step above; this is not a second full build.)
      - name: Check linked libraries (ReleaseFast binary)
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast
          ./scripts/check_linked_libs.sh zig-out/bin/mem3

      # Smoke test that the ReleaseFast build path still links and runs.
      # Benchmarks are machine-dependent, so their numbers are never a gate:
      # this step must not be able to fail the job.
      - name: zig build bench (smoke, never a gate)
        continue-on-error: true
        run: zig build bench

      # Project rule: tests must never write into the repo. Build/runtime
      # litter (.zig-cache/, zig-out/, data/) is covered by .gitignore by
      # policy, so `--porcelain` deliberately reports only real source-tree
      # pollution — which is the failure mode we care about.
      - name: Verify tests left the working tree clean
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::tests wrote into the working tree:"
            echo "$dirty"
            exit 1
          fi
          echo "working tree clean"

      # The most important step in this file. Injects a failing test, asserts
      # the gate goes NON-ZERO, and reverts.
      #
      # Cleanup reasoning: the revert is a shell `trap ... EXIT`, so it runs
      # on every exit path — success, gate-ran-red, `set -e` abort, or an
      # unexpected crash. A later step therefore never inherits a modified
      # tests/main.zig. It is written as `git checkout --` (discard, not
      # `git stash`) so the restore is unconditional and leaves no stash entry.
      - name: 'Guard: the test gate can go red'
        run: |
          set -euo pipefail
          trap 'git checkout -- tests/main.zig' EXIT

          printf '\ntest "CI gate probe" { try std.testing.expect(1 == 2); }\n' >> tests/main.zig

          if zig build test; then
            echo "::error::injected failing test did NOT fail the gate — this gate is always green"
            exit 1
          fi

          echo "gate correctly went red on an injected failure"

  # ---------------------------------------------------------------------------
  # Cross-compilation of the WHOLE project (`zig build` installs the CLI, the
  # static library, mem3-bench and every example), for every supported target.
  #
  # This proves the source compiles and links for the target and that the
  # artifact has the right format. It does NOT run anything foreign: native
  # Linux x86_64/aarch64 and macOS arm64 execution is the job above; macOS
  # x86_64 is compile-only everywhere (no Intel runner in this workflow).
  # Debug and ReleaseFast are both built: they exercise different comptime
  # paths and the examples/bench are ReleaseFast regardless.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu,  file_re: 'ELF 64-bit LSB.*x86-64' }
          - { target: aarch64-linux-gnu, file_re: 'ELF 64-bit LSB.*ARM aarch64' }
          - { target: x86_64-macos,      file_re: 'Mach-O 64-bit.*x86_64' }
          - { target: aarch64-macos,     file_re: 'Mach-O 64-bit.*arm64' }
    env:
      TARGET: ${{ matrix.target }}
      FILE_RE: ${{ matrix.file_re }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Verify toolchain matches .zigversion
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .zigversion)"
          installed="$(zig version)"
          echo "pinned=$pinned installed=$installed"
          if [ "$pinned" != "$installed" ]; then
            echo "::error::toolchain drift: .zigversion says $pinned, runner has $installed"
            exit 1
          fi

      # Each mode gets its own --prefix so a stale artifact from one build can
      # never satisfy the check for another, and the artifact must be
      # non-empty (a failed link can leave a zero-byte file behind).
      - name: zig build -Dtarget=${{ matrix.target }} (Debug + ReleaseFast)
        run: |
          set -euo pipefail
          for mode in Debug ReleaseFast; do
            prefix="${RUNNER_TEMP:-/tmp}/cross-$TARGET-$mode"
            rm -rf "$prefix"
            echo "::group::zig build -Dtarget=$TARGET -Doptimize=$mode"
            zig build -Dtarget="$TARGET" -Doptimize="$mode" --prefix "$prefix"
            echo "::endgroup::"
            for bin in mem3 mem3-bench; do
              [ -s "$prefix/bin/$bin" ] || { echo "::error::$bin missing or empty for $TARGET/$mode"; exit 1; }
            done
            desc="$(file "$prefix/bin/mem3")"
            echo "$desc"
            if ! printf '%s' "$desc" | grep -E -q "$FILE_RE"; then
              echo "::error::mem3 for $TARGET/$mode is not the expected format (wanted /$FILE_RE/)"
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # The platform-scope refusal (constitution v1.1.0, amendment 2026-10-14) must
  # keep firing. For each unsupported target the build must FAIL and its output
  # must contain the documented message from src/lib.zig. If the build starts
  # succeeding, or fails with an unrelated error, the refusal has rotted.
  # ---------------------------------------------------------------------------
  unsupported-targets:
    name: Windows and WASM are refused
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Assert unsupported targets fail with the documented refusal
        run: |
          set -uo pipefail
          expected='mem3 supports macOS and Linux only'
          status=0
          for target in x86_64-windows wasm32-wasi wasm32-freestanding; do
            log="${RUNNER_TEMP:-/tmp}/refuse-$target.log"
            rc=0
            zig build -Dtarget="$target" --prefix "${RUNNER_TEMP:-/tmp}/refuse-$target" >"$log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::-Dtarget=$target BUILT, but it must be refused"
              status=1
            elif ! grep -q "$expected" "$log"; then
              echo "::error::-Dtarget=$target failed (exit $rc) but without the documented refusal '$expected'"
              tail -n 40 "$log"
              status=1
            else
              echo "ok: -Dtarget=$target refused (exit $rc) with the documented message"
            fi
          done
          exit "$status"
