name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Pack release archives
        run: bash scripts/package_release.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            Prebuilt `mem3` for macOS and Linux. The Linux binaries are statically linked against musl.
            Install with Homebrew: `brew tap chy3xyz/tap && brew install mem3`.
          files: |
            zig-out/releases/aarch64-macos.zip
            zig-out/releases/x86_64-macos.zip
            zig-out/releases/aarch64-linux-musl.tar.xz
            zig-out/releases/x86_64-linux-musl.tar.xz
            zig-out/releases/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
